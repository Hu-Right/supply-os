<!doctype html>
<html lang="zh-CN" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ═══════════════════════════════════════════════════════════════
         SEO 核心标签（P0 优先级）
         ═══════════════════════════════════════════════════════════════ -->
    <title>云境全球智能展厅与国际采购操作系统 - 外贸员全球采购订单雷达</title>
    <meta name="description" content="云境OS是外贸员的全球采购订单雷达。不再到处找客户、搜Tender、翻政府网站，登录即可看到哪些国家、哪些机构、哪些企业正在采购您的产品。799元/年入驻，获取全球采购商机。" />
    <meta name="keywords" content="国际采购,全球采购,外贸,采购订单,Tender,招标公告,供应商管理,CRM,外贸员,采购雷达,osneosmart,云境公采" />
    <meta name="author" content="云境科技" />
    <link rel="canonical" href="https://osneosmart.com/" />

    <!-- ═══════════════════════════════════════════════════════════════
         Open Graph 标签（Facebook/微信/LinkedIn 分享优化）
         ═══════════════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="云境全球智能展厅" />
    <meta property="og:title" content="云境全球智能展厅与国际采购操作系统" />
    <meta property="og:description" content="外贸员的全球采购订单雷达 - 直接查看哪些国家、机构、企业正在采购您的产品" />
    <meta property="og:url" content="https://osneosmart.com/" />
    <meta property="og:image" content="https://osneosmart.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />

    <!-- ══════════════════════════════════════════════════════════════
         Twitter Card 标签（Twitter/X 分享优化）
         ══════════════════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="云境全球智能展厅与国际采购操作系统" />
    <meta name="twitter:description" content="外贸员的全球采购订单雷达 - 直接查看全球采购商机" />
    <meta name="twitter:image" content="https://osneosmart.com/og-image.png" />

    <!-- ═══════════════════════════════════════════════════════════════
         搜索引擎爬虫控制
         ═══════════════════════════════════════════════════════════════ -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="baiduspider" content="index, follow" />

    <!-- P3-1 PWA 支持：manifest + iOS 主屏图标 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/earth.png" />
    <link rel="apple-touch-icon" href="/weixin-service-qr.png" />
    <!-- 缓存控制由服务端 HTTP 响应头 Cache-Control: no-store 统一保障（见 server/bootstrap.ts SPA 回退路由），
         meta http-equiv 标签对 CDN/反向代理无效，已移除以避免"已处理缓存"的错觉 -->
    <!-- P1 性能优化：资源预加载提示——提前建立外部域名连接、预解析支付/翻译服务域名 -->
    <!-- 回滚：删除下方 link[rel=preconnect]/link[rel=dns-prefetch] 行即可 -->
    <link rel="preconnect" href="https://osneosmart.com" crossorigin />
    <link rel="dns-prefetch" href="https://openapi.alipay.com" />
    <link rel="dns-prefetch" href="https://api.mch.weixin.qq.com" />
    <link rel="dns-prefetch" href="https://api.deepseek.com" />
    <!-- P0 性能优化：关键 API 端点预加载——国家/机构列表在页面加载时提前获取 -->
    <!-- 预期收益：下拉列表加载时间减少 100-200ms -->
    <!-- 回滚：删除下方 link[rel=preload] 行即可 -->
    <link rel="preload" href="/api/notices/countries" as="fetch" crossorigin />
    <link rel="preload" href="/api/notices/agencies" as="fetch" crossorigin />
    <!-- P2 性能优化：首屏骨架屏 CSS 内联——JS 加载期间即显示加载占位，消除白屏闪烁 -->
    <!-- 回滚：删除 <style>...</style> 块即可 -->
    <style>
      .skeleton-root{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc}
      .skeleton-spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#0d9488;border-radius:50%;animation:sk-spin .6s linear infinite}
      @keyframes sk-spin{to{transform:rotate(360deg)}}
    </style>
    <title>云境全球智能展厅与国际采购操作系统</title>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"><div class="skeleton-root"><div class="skeleton-spinner"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
