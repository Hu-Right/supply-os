# ============================================================
# Supply-OS 生产环境 Docker Compose 编排
# ============================================================
# 服务: app (Node.js) + mysql (MySQL 8.0) + meilisearch (可选)
#
# 使用方式:
#   1. cp .env.production.example .env.production  # 复制并填写真实值
#   2. docker compose up -d --build                # 构建 + 启动
#   3. docker compose logs -f app                  # 查看启动日志
# ============================================================

services:
  # ── MySQL 8.0 ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: supply-os-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-crm}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"    # 仅本机可访问，不暴露到公网
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Meilisearch (可选搜索引擎) ─────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: supply-os-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - with-search    # 仅 `docker compose --profile with-search up` 时启动

  # ── Supply-OS 应用 ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-os-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # 容器内服务名作为数据库/搜索引擎地址（compose 内部 DNS 解析）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-crm}
      MEILI_HOST: http://meilisearch:7700
      NODE_ENV: production
    ports:
      - "3039:3039"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3039/api/system/version').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mysql-data:
    driver: local
  meili-data:
    driver: local
