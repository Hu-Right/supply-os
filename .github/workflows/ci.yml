name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Typecheck · Lint · Tests · Coverage Gates · Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (encoding + eslint)
        run: npm run lint

      - name: i18n key consistency (6 locales, zh baseline)
        run: npm run check-i18n

      - name: Unit tests + coverage gate (90%)
        run: npm run test:unit && npm run test:coverage-gate -- coverage/unit 90

      - name: Integration tests + coverage gate (80%)
        run: npm run test:integration:coverage && npm run test:coverage-gate -- coverage/integration 80

      - name: Production build
        run: npm run build
        env:
          # 构建期最小 env：防止 instrumentation / jwt 生产 fail-fast 误触发
          NODE_ENV: production
          PAYMENT_MODE: live
          JWT_SECRET: ci-build-dummy-secret

  css-compat:
    name: CSS 降编译 · 产物静态门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: CSS 管线及门禁正反例（含 RTL 逻辑属性/渐变回退/级联层展开）
        run: npm run test:css-compat
      - name: 生产构建及 CSS 产物门禁
        # build 末尾自动执行 check:css-compat，对真实 .next/static 产物做 AST 门禁
        run: npm run build
        env:
          NODE_ENV: production
          PAYMENT_MODE: live
          JWT_SECRET: ci-build-dummy-secret

  browser-compat:
    name: CSS 回退 · 移动端生产产物冒烟
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 生产构建（供样式冒烟服务真实产物）
        run: npm run build
        env:
          NODE_ENV: production
          PAYMENT_MODE: live
          JWT_SECRET: ci-build-dummy-secret
      - name: 安装移动端测试内核
        run: npx playwright install --with-deps chromium webkit
      - name: 检查同一份产物的资源、窄屏布局与 RTL
        # 直接服务刚构建的 HTML/CSS/JS；只读 API 样例隔离数据库，非完整后端 E2E。
        run: npm run test:e2e:styles
      - name: 保存浏览器失败证据
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-compat-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
