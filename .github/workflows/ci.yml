name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Typecheck · Lint · Tests · Coverage Gates · Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (encoding + eslint)
        run: npm run lint

      - name: i18n key consistency (6 locales, zh baseline)
        run: npm run check-i18n

      - name: Unit tests + coverage gate (90%)
        run: npm run test:unit && npm run test:coverage-gate -- coverage/unit 90

      - name: Integration tests + coverage gate (80%)
        run: npm run test:integration:coverage && npm run test:coverage-gate -- coverage/integration 80

      - name: Production build
        run: npm run build
        env:
          # 构建期最小 env：防止 instrumentation / jwt 生产 fail-fast 误触发
          NODE_ENV: production
          PAYMENT_MODE: live
          JWT_SECRET: ci-build-dummy-secret

  css-compat:
    name: CSS 降编译 · 产物静态门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: CSS 管线及门禁正反例（含 RTL 逻辑属性/渐变回退/级联层展开）
        run: npm run test:css-compat
      - name: 生产构建及 CSS 产物门禁
        # build 末尾自动执行 check:css-compat，对真实 .next/static 产物做 AST 门禁
        run: npm run build
        env:
          NODE_ENV: production
          PAYMENT_MODE: live
          JWT_SECRET: ci-build-dummy-secret

  browser-compat:
    name: CSS 回退 · 移动端生产产物冒烟
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 生产构建（供样式冒烟服务真实产物）
        run: npm run build
        env:
          NODE_ENV: production
          PAYMENT_MODE: live
          JWT_SECRET: ci-build-dummy-secret
      - name: 安装移动端测试内核
        run: npx playwright install --with-deps chromium webkit
      - name: 检查同一份产物的资源、窄屏布局与 RTL
        # 直接服务刚构建的 HTML/CSS/JS；只读 API 样例隔离数据库，非完整后端 E2E。
        run: npm run test:e2e:styles
      - name: 保存浏览器失败证据
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-compat-results
          path: |
            playwright-report/
            test-results/
          # 全绿时 Playwright 不产出报告目录，缺件属正常态，不应刷告警
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E · 结构基线建表 + 无数据冒烟（Playwright + MySQL）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: supply_os_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # 只给结构不给数据：本 job 的库是从 db/schema/*.sql 建出来的空库，
      # 因此只验证「基线能建出可用结构 + 页面渲染 + 鉴权/参数边界」；
      # 依赖套餐/额度/商机等业务数据的认证态旅程跑本地/内网真库（见 ARCHITECTURE.md）。
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: supply_os_test
      JWT_SECRET: ci-e2e-dummy-secret
      # 本 job 用 `next start` 起生产产物，NODE_ENV 恒为 production；instrumentation
      # 的生产 fail-fast 要求 PAYMENT_MODE=live，否则进程直接 exit(1) → 端口从未监听
      # → 冒烟用例全部 ECONNREFUSED。空库无支付宝配置行，getContext 仍只注册 mock 策略，
      # 支付行为与 mock 完全一致，故 live 仅为通过启动闸门，不影响本套件任何断言。
      PAYMENT_MODE: live
      SMS_PROVIDER: mock
      MEILI_ENABLED: "off"
      # 空库上不需要宽表/索引同步；关掉以免后台任务白烧连接与时间
      SYNC_WORKER_IN_APP: "off"
      LLM_KEY_SECRET: ci-e2e-llm-secret
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 载入结构基线（db/schema/*.sql）
        run: |
          shopt -s nullglob
          files=(db/schema/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::缺少 db/schema/*.sql 结构基线，E2E 无法建表。请重跑 scripts/tools/dump-schema-baseline.mjs 并提交全库终态 DDL（见 db/schema/README.md）。"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "[e2e] 导入 $f"
            mysql -h127.0.0.1 -P3306 -uroot -proot supply_os_test < "$f"
          done
      - name: 生产构建
        run: npm run build
      - name: 安装 Chromium 测试内核
        run: npx playwright install --with-deps chromium
      - name: 启动应用并跑无数据冒烟旅程
        run: |
          npm run start > server-start.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/ >/dev/null; then READY=1; break; fi
            sleep 3
          done
          # 启动即退出（多为 instrumentation fail-fast）会以 17 条 ECONNREFUSED 伪装成测试失败，
          # 这里显式判定就绪状态并回吐服务器日志，让真实原因一眼可见。
          if [ "$READY" -ne 1 ]; then
            echo "::error::应用在 120s 内未就绪，冒烟测试中止。以下为 next start 输出："
            cat server-start.log
            exit 1
          fi
          npx playwright test --project=chromium tests/e2e/ci-smoke.spec.ts
      - name: 保存 E2E 失败证据
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-results
          path: |
            playwright-report/
            test-results/
          # 同上：用例全过时两个目录都不存在，忽略而非告警
          if-no-files-found: ignore
          retention-days: 7
