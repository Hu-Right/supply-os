# 部署工作流：push 到 main 或 PR 合并到 main 后自动部署
# 依赖的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST          服务器公网 IP，如 117.72.108.14
#   SSH_USER          登录用户，通常 root
#   SSH_PRIVATE_KEY   私钥（公钥需放在服务器 ~/.ssh/authorized_keys）
#   SSH_PORT          默认 22，可省略
name: Deploy to Server

on:
  # 推送到 main 分支时自动触发部署
  push:
    branches: [main]
  # PR 合并到 main 时也触发
  pull_request:
    types: [closed]
    branches: [main]
  # 支持在 GitHub 页面手动触发（需输入确认词）
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DEPLOY 确认部署'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # push 到 main、PR 合并、或手动确认时执行
    if: >
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY')
    steps:
      - name: SSH 到服务器执行部署
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          command_timeout: "30m"
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/root/supply-os
            APP_NAME=supply-os
            BRANCH=main

            echo "[deploy] $(date '+%F %T') 开始部署"
            cd "${APP_DIR}"

            # 1. 拉取最新代码
            echo "[deploy] 拉取最新代码..."
            git fetch origin
            git checkout "${BRANCH}"
            git reset --hard "origin/${BRANCH}"

            # 2. 安装依赖
            echo "[deploy] 安装依赖..."
            if [ -d node_modules ]; then
              npm install
            else
              npm ci
            fi

            # 3. Next.js 构建
            echo "[deploy] 构建..."
            npm run build

            # 3.5 复制 .env 到 standalone 目录（优先使用服务器现有配置）
            if [ -f .next/standalone/.env ]; then
              echo "[deploy] ✓ 保留服务器现有 .next/standalone/.env（避免覆盖生产配置）"
            elif [ -f .env ]; then
              cp .env .next/standalone/.env
              echo "[deploy] 已复制 .env → .next/standalone/.env"
            else
              echo "[deploy] ✗ 未找到任何 .env 文件，应用无法连接数据库"
              exit 1
            fi

            # 3.5.1 强制修正数据库地址为生产服务器地址
            ENV_FILE=".next/standalone/.env"
            sed -i 's/DB_HOST="[^"]*"/DB_HOST="117.72.108.14"/g' "$ENV_FILE"
            sed -i 's/DB_HOST="[^"]*"/DB_HOST="117.72.108.14"/g' .env 2>/dev/null || true
            echo "[deploy] DB_HOST 已设为 117.72.108.14"

            # 3.6 数据库预检（使用 standalone 目录的 .env）
            echo "[deploy] 检查 MySQL 服务..."
            ENV_FILE=".next/standalone/.env"
            DB_USER=$(grep '^DB_USER=' "$ENV_FILE" | cut -d'"' -f2)
            DB_PASS=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'"' -f2)
            DB_HOST=$(grep '^DB_HOST=' "$ENV_FILE" | cut -d'"' -f2)
                        
            if [ -z "$DB_USER" ] || [ -z "$DB_PASS" ]; then
              echo "[deploy] ✗ .env 中缺少 DB_USER 或 DB_PASSWORD"
              exit 1
            fi
                        
            if command -v mysqladmin >/dev/null 2>&1; then
              if mysqladmin -h"$DB_HOST" -u"$DB_USER" -p"$DB_PASS" ping >/dev/null 2>&1; then
                echo "[deploy] ✓ MySQL 连接正常 ($DB_HOST)"
              else
                echo "[deploy]  MySQL 连接失败 (host=$DB_HOST, user=$DB_USER)"
                echo "[deploy]   请检查：1) 数据库服务是否运行  2) 凭据是否正确  3) 网络是否可达"
                exit 1
              fi
            else
              echo "[deploy] ⚠ 跳过 MySQL 预检（mysqladmin 未安装）"
            fi

            # 4. 彻底重启应用（先 kill 清除 pm2 daemon 状态，防止残留旧配置）
            echo "[deploy] 重启应用..."
            pm2 delete "${APP_NAME}" 2>/dev/null || true
            pm2 kill 2>/dev/null || true
            sleep 2  # 等待 pm2 完全停止
            NODE_ENV=production PORT=3039 pm2 start "${APP_DIR}/.next/standalone/server.js" --name "${APP_NAME}"
            pm2 save
                        
            echo "[deploy] $(date '+%F %T') 部署完成"
            pm2 list | grep "${APP_NAME}" || true

      - name: 部署后健康检查
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          script_stop: true
          script: |
            # 等待应用启动（schema 迁移可能需要较长时间，增加等待至 30 秒）
            echo "[health] 等待应用初始化..."
            sleep 30
            
            # 检查 pm2 进程是否存活
            if ! pm2 describe supply-os | grep -q "online"; then
              echo "✗ pm2 进程未运行"
              echo "--- PM2 Logs (last 50 lines) ---"
              pm2 logs supply-os --lines 50 --nostream
              exit 1
            fi
            
            # 健康端点探活（最多重试 12 次，间隔 5 秒，共 60 秒）
            for i in $(seq 1 12); do
              if curl -sf --max-time 5 http://localhost:3039/api/system/version > /dev/null 2>&1; then
                echo "✓ 健康检查通过 (第 ${i} 次尝试)"
                exit 0
              fi
              echo "⏳ 第 ${i} 次尝试失败，等待 5 秒..."
              sleep 5
            done
            
            echo "✗ 健康检查失败：应用未响应"
            echo "--- PM2 Process Status ---"
            pm2 list
            echo "--- PM2 Logs (last 100 lines) ---"
            pm2 logs supply-os --lines 100 --nostream
            exit 1
