# 部署工作流：push 到 main 后自动 SSH 到服务器执行部署
# 依赖的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST          服务器公网 IP，如 117.72.108.14
#   SSH_USER          登录用户，通常 root
#   SSH_PRIVATE_KEY   私钥（公钥需放在服务器 ~/.ssh/authorized_keys）
#   SSH_PORT          默认 22，可省略
name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 GitHub 页面手动触发

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器执行部署脚本
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          command_timeout: "30m"
          script_stop: false
          script: |
            cd /root/supply-os
            bash scripts/deploy.sh

      - name: 诊断：检查服务器状态
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          script: |
            echo "=== .next/standalone/.env 数据库配置 ==="
            grep -E 'DB_HOST|DB_PORT|DB_USER|DB_PASSWORD|DB_NAME' /root/supply-os/.next/standalone/.env 2>/dev/null || echo "文件不存在"
            echo ""
            echo "=== PM2 进程状态 ==="
            pm2 list 2>/dev/null || echo "pm2 未运行"
            echo ""
            echo "=== 最近 30 行应用日志 ==="
            pm2 logs supply-os --lines 30 --nostream 2>/dev/null || echo "无日志"
            echo ""
            echo "=== 健康检查 ==="
            curl -sf --max-time 5 http://localhost:3039/api/system/version && echo " (正常)" || echo " (失败)"
