# 部署工作流：push 到 main 或 PR 合并到 main 后自动部署
# 依赖的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST          服务器公网 IP，如 117.72.108.14
#   SSH_USER          登录用户，通常 root
#   SSH_PRIVATE_KEY   私钥（公钥需放在服务器 ~/.ssh/authorized_keys）
#   SSH_PORT          默认 22，可省略
name: Deploy to Server

on:
  # 推送到 main 分支时自动触发部署
  push:
    branches: [main]
  # PR 合并到 main 时也触发
  pull_request:
    types: [closed]
    branches: [main]
  # 支持在 GitHub 页面手动触发（需输入确认词）
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DEPLOY 确认部署'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # push 到 main、PR 合并、或手动确认时执行
    if: >
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY')
    steps:
      - name: SSH 到服务器执行部署
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          command_timeout: "30m"
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/root/supply-os
            APP_NAME=supply-os
            BRANCH=main

            echo "[deploy] $(date '+%F %T') 开始部署"
            cd "${APP_DIR}"

            # 1. 拉取最新代码
            echo "[deploy] 拉取最新代码..."
            git fetch origin
            git checkout "${BRANCH}"
            git reset --hard "origin/${BRANCH}"

            # 2. 安装依赖
            echo "[deploy] 安装依赖..."
            if [ -d node_modules ]; then
              npm install
            else
              npm ci
            fi

            # 3. Next.js 构建
            echo "[deploy] 构建..."
            npm run build

            # 4. 彻底重启应用
            #    先 kill 旧进程，再删除 pm2 记录，最后用新入口启动
            #    避免 pm2 reload 保留旧入口文件配置（如 dist/server.mjs）
            echo "[deploy] 重启应用..."
            pm2 delete "${APP_NAME}" 2>/dev/null || true
            pm2 kill 2>/dev/null || true
            NODE_ENV=production PORT=3039 pm2 start "${APP_DIR}/.next/standalone/server.js" --name "${APP_NAME}"
            pm2 save

            echo "[deploy] $(date '+%F %T') 部署完成"
            pm2 list | grep "${APP_NAME}" || true

      - name: 部署后健康检查
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          script_stop: true
          script: |
            # 等待应用启动（pm2 kill+start 后需要较长初始化时间）
            sleep 10
            # 检查 pm2 进程是否存活
            pm2 describe supply-os | grep -q "online" || { echo "✗ pm2 进程未运行"; exit 1; }
            # 健康端点探活（最多重试 6 次，间隔 5 秒）
            for i in 1 2 3 4 5 6; do
              if curl -sf --max-time 5 http://localhost:3039/api/system/version > /dev/null 2>&1; then
                echo "✓ 健康检查通过 (第 ${i} 次尝试)"
                exit 0
              fi
              echo "⏳ 第 ${i} 次尝试失败，等待 5 秒..."
              sleep 5
            done
            echo "✗ 健康检查失败：应用未响应"
            pm2 logs supply-os --lines 20 --nostream
            exit 1
