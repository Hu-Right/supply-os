# 部署工作流：push 到 main 后自动 SSH 到服务器执行部署
# 依赖的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST          服务器公网 IP，如 117.72.108.14
#   SSH_USER          登录用户，通常 root
#   SSH_PRIVATE_KEY   私钥（公钥需放在服务器 ~/.ssh/authorized_keys）
#   SSH_PORT          默认 22，可省略
name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 GitHub 页面手动触发

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器执行部署脚本
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          script_stop: true
          script: |
            cd /root/supply-os
            bash scripts/deploy.sh
