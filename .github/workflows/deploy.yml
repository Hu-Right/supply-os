# 部署工作流：PR 合并到 main 后自动部署（禁止直接 push 触发）
# 依赖的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST          服务器公网 IP，如 117.72.108.14
#   SSH_USER          登录用户，通常 root
#   SSH_PRIVATE_KEY   私钥（公钥需放在服务器 ~/.ssh/authorized_keys）
#   SSH_PORT          默认 22，可省略
name: Deploy to Server

on:
  # 仅当 PR 合并到 main 时触发（普通 push 不会触发部署）
  pull_request:
    types: [closed]
    branches: [main]
  # 支持在 GitHub 页面手动触发（需输入确认词）
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DEPLOY 确认部署'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # 仅当 PR 被合并（非关闭）时执行，或手动确认
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY')
    steps:
      - name: SSH 到服务器执行部署脚本
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: "22"
          command_timeout: "30m"
          script_stop: true
          script: |
            cd /root/supply-os
            bash scripts/deploy.sh
